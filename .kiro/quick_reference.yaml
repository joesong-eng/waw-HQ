lessons_learned_20260508:
  sim_bill_heartbeat:
    incident: "Hubie 在 sim-bill 加了 heartbeat 功能，但只加了一半（漏了 nginx proxy），造成 405 錯誤"
    rule: "sim-bill 是紙鈔機模擬器，不是平板。平板心跳由 iHub 主頁面處理，sim-bill 只模擬投幣行為"
    lesson: "新增功能前必須確認職責範圍，不可隨意在模擬器加不相關的功能"

  hardware_status_chain:
    incident: "Hardware SP32 顯示『未知狀態』，因為 Infra Listener 只訂閱 kiosk/+/event，沒有訂閱 kiosk/+/status"
    correct_chain: "韌體 MQTT kiosk/{chip_id}/status → Infra Listener → Member webhook POST /internal/kiosk/status → WebSocket broadcast → 工程頁面"
    sim_chain: "sim-bill → POST /api/simulator/status → server/index.js proxy → POST api.tg25.win/api/kiosk/hardware-status → MQTT → 同上"
    lesson: "模擬器必須走跟真實韌體完全相同的鏈路，不可繞過任何一層"

  agent_deploy_verification:
    incident: "Ina 說完成但代碼只在本地沒有部署，HQ curl 測試 404 才發現"
    rule: "Agent 回報完成必須附上實際驗證結果（curl 回傳、log 截圖），HQ 必須親自驗證才算通過"
    lesson: "不接受口頭回報，HQ 驗證通過才通知 Boss 測試"

  infra_listener_path:
    note: "生產環境運行的是 /home/ubuntu/kiosk_event_listener.py，不是專案目錄內的版本"
    rule: "Ina 部署 Listener 修改時，必須同步 /home/ubuntu/kiosk_event_listener.py，不只是 git push"

  new_feature_half_done:
    incident: "Hubie 多次加了一半的功能（heartbeat 加前端沒加 nginx、改 Echo.join() 沒考慮 auth）"
    rule: "新增功能必須完整：前端 + 後端 + nginx（如需要）+ 驗證，缺一不可"
    lesson: "加功能前先列出所有需要改的地方，HQ 審核後才動手"

lessons_learned_20260510:
  sim_bill_event_overriding:
    incident: "iHub 按確認入帳後 sim-bill 沒反應，最終超時失敗。Hubie 發現後端 /api/simulator/bill 用 if(amount) 判斷事件類型，導致 ba_state:STACKED 被錯誤改成 event:escrow"
    root_cause: "後端 proxy 粗暴地用 amount 欄位推測事件類型，而非嚴格依賴 ba_state"
    correct_logic: "事件映射必須嚴格依賴 ba_state，不可用其他欄位推測"
    lesson: "模擬器必須與真實韌體走完全相同的鏈路，後端 proxy 不應該「聰明」地修改前端發送的資料"

  sim_bill_race_condition:
    incident: "Console 出現 Invalid: STACKED -> STACKED 錯誤，狀態機拒絕轉換"
    root_cause: "StateMachine 有 setTimeout 自動推進，SSE 監聽器又手動 transition()，雙重觸發"
    correct_logic: "單一狀態控制權原則：狀態轉換只能由一個地方控制"
    lesson: "事件監聽器只負責觸發初始狀態，後續交給 StateMachine 自動推進"

  sim_bill_config_pollution:
    incident: "測試時 sim-bill 的 chip_id 和 node_id 與資料庫不一致，導致 MQTT 訂閱錯誤的主題"
    root_cause: "sim-bill 有動態配置面板，用戶隨意修改導致身分與資料庫脫節"
    correct_logic: "模擬器身分必須寫死對齊資料庫，不可讓用戶修改"
    lesson: "測試環境的配置必須與生產環境一致，localStorage 不應該保存會影響系統行為的關鍵配置"

  hq_diagnostic_failure:
    incident: "HQ 只檢查檔案、git commit、nginx，沒有追查執行流程和邏輯錯誤，浪費大量時間"
    root_cause: "違反 coding-guidelines.md 原則：只檢查表面，沒有 Investigate Before Answering"
    correct_approach: "看 log 確認每個步驟是否執行 → 追查為什麼沒有執行 → 找到根本原因 → 修復 → 再測試"
    lesson: "診斷問題要追查執行流程，不是檢查檔案。「代碼已部署」不等於「功能正常」。成功標準是「Boss 看到預期結果」"

  sse_keep_alive:
    technical_note: "Cloudflare 對長連線有超時（通常 100 秒），SSE 沒有 keep-alive 就會被切斷"
    solution: "每 25 秒送 keep-alive ping，nginx 加 proxy_buffering off"
    reference: "brains/history/LESSON_20260510_SIM_BILL_DEBUGGING.md"

  ui_task_screenshot_mandatory:
    rule: "UI 任務完成必須附上橫屏 + 直屏截圖，無截圖 = 未完成任務"
    reason: "避免 HQ 必須親自打開測試網址驗證"
    source: "Hubie AI_CONTEXT.md 坑 #1"

  optimistic_ui_principle:
    rule: "點擊立刻跳轉 Stage，先顯示 Loading，API 請求在背景執行"
    anti_pattern: "點擊後等 API 回來才切畫面，網路慢時使用者以為當機"
    source: "Hubie AI_CONTEXT.md 坑 #6"

  init_race_condition:
    problem: "init() 覆寫了使用者的主動點擊，把使用者踢回首頁"
    solution: "init() 中的狀態設定必須有保護條件：if (state === 'idle') setState('idle')"
    rule: "絕對不能無條件覆寫目前狀態，避免產生 Race Condition"
    source: "Hubie AI_CONTEXT.md 坑 #7"

