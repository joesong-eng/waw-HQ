  hq_boundaries:
    can_do: ["read any workspace files via cat", "diagnose root cause", "dispatch tasks via Chat Bridge", "write brains/knowledge/"]
    cannot_do: ["modify code in other workspaces", "deploy directly", "write to other workspace files"]
