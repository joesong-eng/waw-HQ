# AI Agent Registry (Optimized for AI parsing)

subagents:
  alliance-dev:
    type: sub_agent
    project: Alliance
    workspace: /Users/ilawusong/Documents/sysWawIot/Alliance
    domain: ali.tg25.win
    tools: [read, write, shell]
    responsibilities:
      - code_modification
      - feature_development
      - bug_fixing
      - local_testing
    workflow:
      - locate_files
      - execute_modification
      - record_to_alliance_journal: Alliance/agents/journals/dev_distillation.md
      - report_results
    forbidden:
      - modify_production_directly
      - execute_migrations
      - delete_important_files
      - cross_project_pollution
    
  alliance-cleaner:
    type: sub_agent
    project: Alliance
    workspace: /Users/ilawusong/Documents/sysWawIot/Alliance
    responsibilities:
      - document_quality_check
      - identify_contradictions
      - identify_redundancy
      - identify_outdated_content
      - identify_militarized_language
      - unify_document_style
      - simplify_architecture_concepts
      - clarify_role_positioning
    usage: "@alliance-cleaner analyze <file/directory>" or "@alliance-cleaner clean <file>"
    
  hq-coordinator:
    type: sub_agent
    project: HQ
    responsibilities:
      - task_dispatch_to_other_agents
      - track_execution_status
      - coordinate_cross_project_work
    usage: "叫 XXX 做 YYY"
    workflow:
      - parse_user_command
      - identify_target_agent
      - dispatch_task_via_hq_task_flow_sh
      - track_and_report_status

